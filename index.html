<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ドラム</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="drums">
            <div class="bass-drum"></div>
            <div class="snare-drum"></div>
            <div class="floor-tom"></div>
            <div class="high-tom"></div>
            <div class="low-tom"></div>
        </div>

        <div class="cymbals">
            <div class="hi-hat-cymbals">
                <div class="hi-hat-on"></div>
                <div class="hi-hat-under"></div>
                <div class="hi-center-pipe-1g"></div>
                <div class="hi-center-pipe-2g"></div>
                <div class="hi-center-pipe-3g"></div>
                <div class="hi-center-pipe"></div>
                <div class="hi-1"></div>
                <div class="hi-1-sub"></div>
                <div class="hi-2"></div>
                <div class="hi-2-sub"></div>
                <div class="hi-3"></div>
                <div class="hi-3-sub"></div>
                <div class="hi-pedal"></div>
                <div class="hi-pedal-under"></div>
                <div class="hi-pedal-center"></div>
                <div class="hi-pedal-left"></div>
                <div class="hi-pedal-right"></div>
                <div class="hi-pedal-sub"></div>
            </div>

            <div class="crash-cymbal-left"></div>
            <div class="crash-cymbal-right">
                <div class="crash-right"></div>
            </div>

            <div class="ride-cymbal">
                <div class="r-cymbal"></div>
                <div class="r-center-pipe"></div>
                <div class="r-1"></div>
                <div class="r-1-sub"></div>
                <div class="r-2"></div>
                <div class="r-2-sub"></div>
                <div class="r-3"></div>
                <div class="r-3-sub"></div>
            </div>
        </div>
            <div class="kick-pedal"></div>
    </body>
</html>
